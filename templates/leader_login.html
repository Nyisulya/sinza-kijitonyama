{% extends 'base.html' %}

{% block title %}Kuingia - Viongozi{% endblock %}

{% block extra_head %}
<style>
    .login-container {
        max-width: 420px;
        margin: 60px auto 40px;
        animation: fadeIn 0.4s ease-out;
    }
    
    .login-card {
        background: white;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 40px 30px;
        box-shadow: var(--shadow-xl);
        text-align: center;
    }
    
    .login-icon-circle {
        width: 64px;
        height: 64px;
        border-radius: var(--radius-full);
        background: linear-gradient(135deg, var(--primary), var(--primary-light));
        color: white;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        margin-bottom: 24px;
        box-shadow: 0 8px 16px var(--primary-glow);
    }
    
    .login-header-text {
        font-size: 22px;
        font-weight: 800;
        color: var(--primary);
        margin-bottom: 8px;
    }
    
    .login-subheader {
        font-size: 14.5px;
        color: var(--text-muted);
        margin-bottom: 30px;
    }

    .passcode-input {
        letter-spacing: 6px;
        text-align: center;
        font-size: 20px;
        font-weight: 700;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-icon-circle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        
        <h1 class="login-header-text">Ingia Sehemu ya Viongozi</h1>
        <p class="login-subheader">Tafadhali ingiza neno la siri la viongozi kuendelea.</p>
        
        <form action="{% url 'leader_login' %}" method="post">
            {% csrf_token %}
            
            <div class="form-group" style="margin-bottom: 24px;">
                <label for="passcode" class="form-label" style="text-align: center; display: block; margin-bottom: 12px;">Neno la Siri (Passcode)</label>
                <input type="password" name="passcode" id="passcode" class="form-control passcode-input" 
                       placeholder="••••" maxlength="15" autocomplete="off" autofocus required>
            </div>
            
            <button type="submit" class="btn-primary btn-block" style="padding: 14px; font-weight: 700; font-size: 15px;">Thibitisha kuingia</button>
        </form>
    </div>
</div>
{% endblock %}
